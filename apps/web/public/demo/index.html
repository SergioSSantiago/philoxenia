<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Philoxenia · Demo</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Georgia, serif; background: #1c1f1b; color: #f3efe6; }
    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    h2 { font-size: 1.15rem; margin: 2rem 0 0.5rem; font-weight: 500; }
    p { color: #c8c2b4; line-height: 1.5; }
    video { width: 100%; border-radius: 12px; background: #000; margin-top: 0.75rem; }

<body>
  <main>

    <p><a href="https://philoxenia-iota.vercel.app">Live app</a></p>

    <h2>Commercial (EN)</h2>
    <video controls playsinline preload="metadata">
      <source src="./philoxenia-commercial.mp4" type="video/mp4" />
    </video>

    <h2>Comercial (ES)</h2>
    <video controls playsinline preload="metadata">
      <source src="./philoxenia-commercial-es.mp4" type="video/mp4" />
