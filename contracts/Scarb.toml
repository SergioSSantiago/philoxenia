[package]
name = "philoxenia_contracts"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.12.2"
openzeppelin = "2.0.0"

[dev-dependencies]
snforge_std = "0.48.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
exit_first = true
